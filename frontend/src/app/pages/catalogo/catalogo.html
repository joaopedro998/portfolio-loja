<div class="container">
  
  <div class="cabecalho">
    <h1>Nossa Coleção</h1>
    <button class="btn-carrinho" routerLink="/carrinho">🛒 Carrinho</button>
  </div>

  <div class="grid-produtos">
    
    <!-- SINTAXE NOVA DO ANGULAR: Mais rápida e não dá erro de módulo -->
    @for (produto of produtos; track produto.id) {
      <div class="card" [routerLink]="['/produto', produto.id]" style="cursor: pointer;">
        <img [src]="produto.imagem" [alt]="produto.nome">
        
        <div class="card-info">
          <h3>{{ produto.nome }}</h3>
          <p class="preco">{{ produto.preco | currency:'BRL':'symbol':'1.2-2' }}</p>
          
          <button class="btn-comprar">Ver Detalhes</button>
        </div>
      </div>
    } @empty {
      <!-- Essa mensagem só aparece se a lista estiver vazia -->
      <p style="text-align: center; width: 100%; grid-column: 1 / -1;">
        Nenhuma peça encontrada no banco de dados.
      </p>
    }
    
  </div>

</div>
